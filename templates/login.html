<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | TrackMySubs</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* BACKGROUND */
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#cad2d8,#dce2e8);
}

/* MAIN WRAPPER */
.login-wrapper{
display:flex;
width:900px;
height:500px;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 30px 60px rgba(0,0,0,0.25);
}

/* FORM */
.form-container{
flex:1;
padding:50px 45px;
}

.form-container h2{
text-align:center;
margin-bottom:25px;
color:#1e293b;
}

/* FORM GROUP */
.form-group{
margin-bottom:18px;
}

.form-group label{
font-size:14px;
color:#334155;
display:block;
margin-bottom:6px;
}

.form-group input{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:10px;
font-size:14px;
}

.form-group input:focus{
outline:none;
border-color:#3B82F6;
box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}

/* BUTTON */
.btn{
width:100%;
padding:12px;
background:linear-gradient(135deg,#3B82F6,#2563EB);
border:none;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

/* SIGNUP */
.signup-link{
text-align:center;
margin-top:18px;
font-size:14px;
}

.signup-link a{
color:#2563eb;
text-decoration:none;
}

/* FLASH */
.flash-message{
padding:12px;
margin-bottom:15px;
border-radius:8px;
text-align:center;
}

.flash-message.error{
background:#fee2e2;
color:#991b1b;
}
.flash-message.success{
background:#fee2e2;
color:#2ba04c;
}

/* IMAGE */
.login-image{
flex:1;
}

.login-image img{
width:100%;
height:100%;
object-fit:cover;
}

/* BACK BUTTON */
.back-btn {
position: fixed;
bottom: 20px;
left: 20px;
padding: 12px 18px;
background: #2563eb;
color: white;
text-decoration: none;
border-radius: 8px;
}

</style>

</head>

<body>

<a href="/" class="back-btn">⬅ Back</a>

<div class="login-wrapper">

<div class="form-container">

<h2>Login</h2>

<!-- FLASH -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="flash-message {{ category }}">
    {{ message }}
</div>
{% endfor %}
{% endwith %}

<form action="/login" method="POST">

<div class="form-group">
<label>Email</label>

<input 
type="text"
name="email"
placeholder="Enter your email"
required
minlength="10"
maxlength="50"

title="Email must start with a letter or underscore and be a valid Gmail address"
oninvalid="this.setCustomValidity('Enter a valid Gmail ')"
oninput="this.setCustomValidity('')">
</div>

<div class="form-group">
<label>Password</label>
<input 
type="password"
name="password"
placeholder="Enter your password"
required
minlength="8"
maxlength="15"
title="Password must be 8–15 characters">
</div>

<button type="submit" class="btn">Login</button>

</form>

<div class="signup-link">
Don't have an account? <a href="/register">Register</a>
</div>

</div>

<div class="login-image">
<img src="{{ url_for('static', filename='images/login.jpeg') }}" alt="Login Illustration">
</div>

</div>

</body>
</html>
