<!DOCTYPE html>
<html>
<head>
    <title>Bill Details</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: green;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
        }

        .paid {
            background: green;
        }

        .unpaid {
            background: red;
        }

        .btn {
            display: block;
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            background: #4a6cf7;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🧾 Bill Details</h2>

        <div class="row">
            <span>Service:</span>
            <span>{{ service_name }}</span>
        </div>

        <div class="row">
            <span>Start Date:</span>
            <span>{{ start_date }}</span>
        </div>

        <div class="row">
            <span>End Date:</span>
            <span>{{ end_date }}</span>
        </div>

        <div class="row">
            <span>Total Days:</span>
            <span>{{ total_days }}</span>
        </div>

        <div class="row">
            <span>Paused Days:</span>
            <span>{{ pause_days }}</span>
        </div>

        <div class="row">
            <span>Active Days:</span>
            <span>{{ active_days }}</span>
        </div>

        <div class="row">
            <span>Price per Day:</span>
            <span>₹ {{ price }}</span>
        </div>

        <div class="row">
            <span>Quantity:</span>
            <span>{{ quantity }}</span>
        </div>

        <hr>

        <div class="row total">
            <span>Total Amount:</span>
            <span>₹ {{ total_amount }}</span>
        </div>

        

        <a href="{{ url_for('dashboard') }}" class="btn">⬅ Back to Dashboard</a>
    </div>
</div>

</body>
</html>
