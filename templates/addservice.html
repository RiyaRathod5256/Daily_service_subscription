<!DOCTYPE html>
<html>
<head>
<title>Add Service</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f4c81,#4da3ff);
padding:30px;
}

/* FORM CARD */

.container{
width:720px;
max-width:95%;
background:rgba(231, 213, 227, 0.944);
backdrop-filter:blur(10px);
padding:40px;
border-radius:18px;
box-shadow:0 25px 60px rgba(0,0,0,0.25);
border:1px solid rgba(255,255,255,0.25);
}

/* HEADER */

.header{
text-align:center;
margin-bottom:30px;
}

.header h2{
font-size:28px;
color:#1e293b;
}

/* ADD BUTTON */

.add-btn{
width:100%;
padding:14px;
margin-bottom:25px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#3B82F6,#2563EB);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.add-btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(37,99,235,0.5);
}

/* FORM GRID */

#serviceForm{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* FULL WIDTH ITEMS */

.submit-btn{
grid-column:span 2;
}

/* FORM GROUP */

.form-group{
display:flex;
flex-direction:column;
}

/* LABEL */

label{
margin-bottom:6px;
font-size:14px;
color:#1f2937;
}

/* INPUT */

input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid rgba(0,0,0,0.15);
font-size:14px;
background:white;
transition:.3s;
}

input:focus{
outline:none;
border-color:#3b82f6;
box-shadow:0 0 0 3px rgba(59,130,246,0.2);
}

/* SUBMIT BUTTON */

.submit-btn{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#3b82f6,#2563eb);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.submit-btn:hover{
transform:translateY(-2px);
box-shadow:0 12px 30px rgba(37,99,235,0.5);
}

/* RESPONSIVE */

@media(max-width:700px){

#serviceForm{
grid-template-columns:1fr;
}

.submit-btn{
grid-column:span 1;
}

}
.flash-message{
position:fixed;
top:20px;
right:20px;

display:flex;
align-items:center;
gap:10px;

background:#16a34a;
color:white;

padding:14px 18px;

border-radius:10px;

font-size:14px;
font-weight:500;

box-shadow:0 10px 25px rgba(0,0,0,0.2);

animation:slideIn 0.4s ease;
}

/* icon size */
.flash-message i{
font-size:18px;
}

/* animation */

@keyframes slideIn{
from{
opacity:0;
transform:translateX(40px);
}
to{
opacity:1;
transform:translateX(0);
}
}

.back-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;

    padding: 12px 18px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 500;

    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
}

.back-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.25);
}

</style>
</head>
{% with  messages=get_flashed_messages() %}
{%if messages %}
{% for message in messages %}
<div class="flash-message">
<i class="fas fa-check-circle"></i> {{ message }}
</div>

{%endfor%}
{%endif%}
{%endwith%}


<body>

<div class="container">

<div class="header">
<h2>Add New Service</h2>
</div>

<button class="add-btn" type="button">+ Add Service</button>

<form id="serviceForm" method="POST" action="/addservice">

<div class="form-group">
<label>Service Name</label>
<input type="text" id="service_name" name="service_name"
required minlength="3" placeholder="Enter service name">
</div>

<div class="form-group">
<label>Service Provider</label>
<input type="text" id="provider" name="provider"
required placeholder="Enter provider name">
</div>

<div class="form-group">
<label>Provider Number</label>
<input type="tel" id="number" name="number"
required pattern="[0-9]{10}" maxlength="10"
placeholder="10 digit mobile number">
</div>

<div class="form-group">
<label>Provider Address</label>
<input type="text" id="address" name="address"
required placeholder="Enter provider address">
</div>

<div class="form-group">
<label>Price per Day</label>
<input type="number" id="price" name="price"
required min="1" step="0.01" placeholder="Enter price">
</div>

<div class="form-group">
<label>Daily Quantity</label>
<input type="number" id="quantity" name="quantity"
required min="1" placeholder="Enter quantity">
</div>

<div class="form-group">
<label>Start Date</label>
<input type="date" id="start" name="start" required>
</div>

<div class="form-group">
<label>End Date</label>
<input type="date" id="end" name="end" required>
</div>

<button class="submit-btn" type="submit">Save Service</button>

</form>


</div>

<a href="/dashboard" class="back-btn">⬅ Back</a>

</body>
</html>


<a href="/dashboard" class="back-btn">⬅ Back</a>


<script>
const startInput = document.getElementById("start");
const endInput = document.getElementById("end");
const form = document.getElementById("serviceForm");

// restrict end date
startInput.addEventListener("change", function () {
    endInput.min = this.value;
});

// validate on submit
form.addEventListener("submit", function (e) {
    let start = startInput.value;
    let end = endInput.value;

    if (start > end) {
        alert("Start date cannot be greater than end date");
        e.preventDefault();
    }
});
</script>

</body>
</html>
